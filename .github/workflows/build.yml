name: Build FolderLens

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Test
        shell: powershell
        run: .\test.ps1

      - name: Package portable Windows build
        shell: powershell
        run: .\package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderLens-Windows
          path: |
            dist/FolderLens-Windows.zip
            dist/SHA256SUMS.txt

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              "dist/FolderLens-Windows.zip" `
              "dist/SHA256SUMS.txt" `
              "FolderLens.exe" `
              --clobber
          } else {
            gh release create $tag `
              "dist/FolderLens-Windows.zip" `
              "dist/SHA256SUMS.txt" `
              "FolderLens.exe" `
              --title "FolderLens $tag" `
              --generate-notes
          }
